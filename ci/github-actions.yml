# Copy this file to .github/workflows/ci.yml to enable GitHub Actions CI.
name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Unit + integration tests
        run: python -m unittest tests.test_core tests.test_etl tests.test_api -v
      - name: Browser tests (UI, accessibility audit, style validation)
        run: python -m unittest tests.e2e.test_ui -v
        env:
          HMAPS_SHOTS: shots
      - name: Performance benchmark (country-scale synthetic data)
        run: python -m tests.perf_bench 120000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/app.Dockerfile -t hebrew-maps/app:ci .
      - name: Smoke test (demo data)
        run: |
          docker run -d --name hm -p 8080:8080 hebrew-maps/app:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 2; done
          curl -fs "localhost:8080/api/search?q=%D7%99%D7%A8%D7%95%D7%A9%D7%9C%D7%99%D7%9D" | grep -q results
          curl -fs localhost:8080/ | grep -q "מפות בעברית"
          curl -fsI localhost:8080/vendor/maplibre-gl.js
