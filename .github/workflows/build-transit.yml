name: Build Transit (GTFS)

# Standalone workflow for building public transport timetables from GTFS.
# Fully independent — does not depend on any other build job.
#
# Israeli MOT GTFS data is updated every few days; run this independently
# from the OSM pipeline as needed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the asset to (default: data-latest)"
        default: "data-latest"
        required: false
  schedule:
    - cron: "0 3 * * 2"   # every Tuesday 03:00 UTC (GTFS refreshes mid-week)

jobs:
  build-transit:
    name: Build Transit (GTFS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag || 'data-latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GTFS transit data
        run: python -m hmaps.etl gtfs
        env:
          HMAPS_DATA: data

      - name: Package transit.zip
        id: package
        run: |
          if [ -d data/transit ] && [ "$(ls -A data/transit)" ]; then
            zip -r transit-${{ steps.date.outputs.value }}.zip data/transit/
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No transit data built — skipping upload"
          fi

      - name: Upload transit.zip → release
        if: steps.package.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: true
          files: transit-${{ steps.date.outputs.value }}.zip
