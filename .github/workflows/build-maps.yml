name: Build Maps (OSM Core)

# Standalone workflow for the OSM core database.
# Produces maps.zip and uploads a maps-db artifact for downstream jobs.
#
# Use this to rebuild only the maps DB without running all other jobs.
# Equivalent to the build-maps job in data-modular.yml.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the asset to (default: data-latest)"
        default: "data-latest"
        required: false

env:
  PBF_URL: ${{ vars.HMAPS_PBF_URL || 'https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf' }}

jobs:
  build-maps:
    name: Build Maps (OSM Core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    outputs:
      date-tag: ${{ steps.date.outputs.value }}
      release-tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            osmium-tool \
            gdal-bin \
            libgdal-dev \
            wget \
            zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.release_tag || 'data-latest' }}" >> "$GITHUB_OUTPUT"
          fi

      # ── OSM PBF cache (weekly key) ────────────────────────────────────────
      - name: Restore OSM PBF cache
        id: osm-cache
        uses: actions/cache@v4
        with:
          path: data/sources/israel-and-palestine.osm.pbf
          key: osm-pbf-weekly-${{ steps.date.outputs.value }}
          restore-keys: osm-pbf-weekly-

      - name: Download OSM extract (with retry)
        if: steps.osm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/sources
          wget \
            --tries=5 \
            --retry-connrefused \
            --waitretry=30 \
            --timeout=120 \
            --show-progress \
            -O data/sources/israel-and-palestine.osm.pbf \
            "${{ env.PBF_URL }}"

      - name: Build maps database (OSM core)
        run: python -m hmaps.etl build --engine pyosmium --no-enrich
        env:
          HMAPS_DATA: data
          HMAPS_PBF_URL: file:///${{ github.workspace }}/data/sources/israel-and-palestine.osm.pbf

      - name: Package maps.zip
        run: |
          DB=$(cat data/maps.current 2>/dev/null || echo "maps.db")
          cp "data/$DB" data/maps.db
          zip -j maps-${{ steps.date.outputs.value }}.zip data/maps.db

      - name: Upload maps.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          prerelease: true
          files: maps-${{ steps.date.outputs.value }}.zip

      - name: Upload maps.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-db
          path: data/maps.db
          retention-days: 1
