name: Build Data Package

# Builds the full Israel data package from public sources and uploads each
# component as a separate GitHub Release asset so users can download only
# what they need:
#
#   maps.zip     – maps.db (OSM core: POIs, streets, addresses, routing graph)
#   rich.zip     – maps.db after Wikidata/Wikipedia/Commons/Wikivoyage enrichment
#   media.zip    – offline image thumbnails (data/media/)
#   transit.zip  – GTFS public-transport timetables (data/transit/)
#   terrain.zip  – terrain.mbtiles + contours.mbtiles
#   basemap.zip  – basemap.mbtiles vector tiles
#
# Triggers:
#   - Manual dispatch (on demand)
#   - Weekly on Sunday 02:00 UTC (OSM data updates weekly)
#   - On version tags — installer release and data release stay in sync
on:
  workflow_dispatch:
    inputs:
      skip_terrain:
        description: "Skip terrain/DEM build (~20 min, ~500 MB Copernicus download)"
        type: boolean
        default: false
      skip_basemap:
        description: "Skip basemap MBTiles build (~30 min, requires Java)"
        type: boolean
        default: false
      skip_media:
        description: "Skip image download (can be slow — hundreds of MB from Wikimedia)"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 0"   # every Sunday 02:00 UTC
  push:
    tags: ["v*.*.*"]

jobs:
  build-data:
    name: Build Israel Data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write   # required for creating/updating GitHub Releases

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 3. System tools
      # -----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            osmium-tool \
            gdal-bin \
            libgdal-dev \
            zip

      # -----------------------------------------------------------------------
      # 4. Python packages
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      # -----------------------------------------------------------------------
      # 5. Date tag
      # -----------------------------------------------------------------------
      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Determine release tag
      #    - version push  → attach to that tag's release
      #    - schedule/manual → rolling "data-latest" pre-release
      # -----------------------------------------------------------------------
      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"       >> "$GITHUB_OUTPUT"
            echo "name=מפות בעברית ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=data-latest"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"        >> "$GITHUB_OUTPUT"
            echo "name=נתונים עדכניים — ${{ steps.date.outputs.value }}" >> "$GITHUB_OUTPUT"
          fi

      # =======================================================================
      # CORE BUILD
      # =======================================================================

      # -----------------------------------------------------------------------
      # 7. Download OSM extract (Israel+Palestine, ~150 MB from Geofabrik)
      # -----------------------------------------------------------------------
      - name: Download OSM extract
        run: python -m hmaps.etl download
        env:
          HMAPS_DATA: data

      # -----------------------------------------------------------------------
      # 8. Build maps.db  (POIs, streets, addresses, routing graph)
      #    --no-enrich: fast OSM-only pass; enrichment runs separately below
      # -----------------------------------------------------------------------
      - name: Build maps database (OSM core)
        run: python -m hmaps.etl build --engine pyosmium --no-enrich
        env:
          HMAPS_DATA: data

      # -----------------------------------------------------------------------
      # 9. Package and upload maps.zip  (OSM core DB — smallest, always needed)
      #    The build uses versioned filenames (maps-YYYYMMDD-HHMMSS.db) with a
      #    pointer file (maps.current) — resolve the real name before zipping.
      # -----------------------------------------------------------------------
      - name: Package maps.zip
        run: |
          DB=$(cat data/maps.current 2>/dev/null || echo "maps.db")
          echo "Resolved live DB: data/$DB"
          cp "data/$DB" data/maps.db
          zip -j maps-${{ steps.date.outputs.value }}.zip data/maps.db

      - name: Upload maps.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          body: |
            נתוני ישראל — ${{ steps.date.outputs.value }}
            Built from ${{ github.sha }}
          files: maps-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # RICH CONTENT  (Wikidata · Wikipedia · Wikivoyage · Commons)
      # =======================================================================

      # -----------------------------------------------------------------------
      # 10. Enrich maps.db with Wikidata facts, Wikipedia texts,
      #     Wikivoyage travel guides and Wikimedia Commons photo metadata.
      #     Pass --db explicitly pointing at the canonical copy from step 9.
      # -----------------------------------------------------------------------
      - name: Enrich DB (Wikidata + Wikipedia + Wikivoyage + Commons)
        run: python -m hmaps.etl enrich --db data/maps.db --steps wikidata,wikipedia,wikivoyage,commons,trails
        env:
          HMAPS_DATA: data

      # -----------------------------------------------------------------------
      # 11. Package and upload rich.zip  (enriched DB — adds texts + gallery metadata)
      #     enrich publishes a new versioned file (maps-YYYYMMDD-HHMMSS.db) so
      #     we resolve the pointer again and copy to the canonical name.
      # -----------------------------------------------------------------------
      - name: Package rich.zip
        run: |
          DB=$(cat data/maps.current 2>/dev/null || echo "maps.db")
          echo "Resolved enriched DB: data/$DB"
          cp "data/$DB" data/maps.db
          zip -j rich-${{ steps.date.outputs.value }}.zip data/maps.db

      - name: Upload rich.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: rich-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # OFFLINE IMAGES  (Wikimedia Commons thumbnails)
      # =======================================================================

      # -----------------------------------------------------------------------
      # 12. Download image thumbnails to data/media/
      #     Skippable via workflow_dispatch input; always runs on schedule/tag
      # -----------------------------------------------------------------------
      - name: Download POI images (Wikimedia Commons thumbnails)
        if: ${{ github.event.inputs.skip_media != 'true' }}
        run: python tools/media.py --workers 3 --interval 0.8
        env:
          HMAPS_DATA: data
        continue-on-error: true   # images are optional; don't fail the whole run

      - name: Package media.zip
        if: ${{ github.event.inputs.skip_media != 'true' }}
        run: |
          cd data
          zip -r "../media-${{ steps.date.outputs.value }}.zip" media/ \
            --exclude "media/*.part" --exclude "media/*.tmp"
          cd ..
          ls -lh media-${{ steps.date.outputs.value }}.zip

      - name: Upload media.zip → release
        if: ${{ github.event.inputs.skip_media != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: media-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # TRANSIT  (GTFS public-transport timetables)
      # =======================================================================

      # -----------------------------------------------------------------------
      # 13. Download + convert GTFS feed (Ministry of Transport)
      # -----------------------------------------------------------------------
      - name: Build GTFS transit data
        run: python -m hmaps.etl gtfs
        env:
          HMAPS_DATA: data
        continue-on-error: true   # transit feed sometimes has outages; not fatal

      - name: Package transit.zip
        run: |
          if [ -d data/transit ] && [ "$(ls -A data/transit)" ]; then
            zip -r transit-${{ steps.date.outputs.value }}.zip data/transit/
            echo "transit_built=true" >> "$GITHUB_ENV"
          else
            echo "transit_built=false" >> "$GITHUB_ENV"
            echo "No transit data built — skipping upload"
          fi

      - name: Upload transit.zip → release
        if: env.transit_built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: transit-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # TERRAIN  (Copernicus DEM → terrain.mbtiles + contours.mbtiles)
      # =======================================================================

      # -----------------------------------------------------------------------
      # 14. Install terrain Python dependencies (rio-cogeo, rio-mbtiles, etc.)
      # -----------------------------------------------------------------------
      - name: Install terrain dependencies
        if: ${{ github.event.inputs.skip_terrain != 'true' }}
        run: pip install -r requirements-terrain.txt
        continue-on-error: true

      - name: Build terrain layers
        if: ${{ github.event.inputs.skip_terrain != 'true' }}
        run: python -m tools.terrain build --if-missing --clean
        env:
          HMAPS_DATA: data
        continue-on-error: true

      - name: Package terrain.zip
        if: ${{ github.event.inputs.skip_terrain != 'true' }}
        run: |
          FILES=""
          [ -f data/terrain.mbtiles ]  && FILES="$FILES data/terrain.mbtiles"
          [ -f data/contours.mbtiles ] && FILES="$FILES data/contours.mbtiles"
          if [ -n "$FILES" ]; then
            zip -j terrain-${{ steps.date.outputs.value }}.zip $FILES
            echo "terrain_built=true" >> "$GITHUB_ENV"
          else
            echo "terrain_built=false" >> "$GITHUB_ENV"
            echo "No terrain files found — skipping upload"
          fi

      - name: Upload terrain.zip → release
        if: ${{ github.event.inputs.skip_terrain != 'true' && env.terrain_built == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: terrain-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # BASEMAP  (vector tiles MBTiles)
      # =======================================================================

      # -----------------------------------------------------------------------
      # 15. Build basemap MBTiles (optional — slow, ~600 MB Java tool)
      # -----------------------------------------------------------------------
      - name: Download web assets
        run: python tools/fetch_assets.py
        continue-on-error: true

      - name: Build basemap
        if: ${{ github.event.inputs.skip_basemap != 'true' }}
        run: python tools/basemap.py
        env:
          HMAPS_DATA: data
        continue-on-error: true

      - name: Package basemap.zip
        if: ${{ github.event.inputs.skip_basemap != 'true' }}
        run: |
          if [ -f data/basemap.mbtiles ]; then
            zip -j basemap-${{ steps.date.outputs.value }}.zip data/basemap.mbtiles
            echo "basemap_built=true" >> "$GITHUB_ENV"
          else
            echo "basemap_built=false" >> "$GITHUB_ENV"
            echo "No basemap.mbtiles found — skipping upload"
          fi

      - name: Upload basemap.zip → release
        if: ${{ github.event.inputs.skip_basemap != 'true' && env.basemap_built == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: basemap-${{ steps.date.outputs.value }}.zip

      # =======================================================================
      # SUMMARY
      # =======================================================================

      - name: Show build summary
        if: always()
        run: |
          echo "=== Release assets built ==="
          for f in maps rich media transit terrain basemap; do
            ZIP="${f}-${{ steps.date.outputs.value }}.zip"
            if [ -f "$ZIP" ]; then
              echo "  ✓ $ZIP  $(du -sh $ZIP | cut -f1)"
            else
              echo "  – $ZIP  (not built)"
            fi
          done
