name: Download POI Images

# Downloads POI images (Wikimedia Commons thumbnails) offline into data/media/
# and uploads them as a GitHub Release asset (media-<date>.zip).
#
# Requires an existing data/maps.db — download the latest data release first,
# or run the "Build Data Package" workflow before triggering this one.
#
# Triggers:
#   - Manual dispatch (on demand)
#   - Weekly on Monday 04:00 UTC (after the Sunday data build)
on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel download workers (default 2; keep low to avoid rate-limits)"
        default: "2"
      interval:
        description: "Minimum seconds between requests (default 1.0)"
        default: "1.0"
      retry_failed:
        description: "Retry images that failed permanently in a previous run"
        type: boolean
        default: false
      data_release_tag:
        description: "GitHub Release tag to download maps.db from (default: data-latest)"
        default: "data-latest"
  schedule:
    - cron: "0 4 * * 1"   # every Monday 04:00 UTC (day after the Sunday data build)

jobs:
  download-images:
    name: Download POI Images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # required for creating/updating GitHub Releases

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 3. Python dependencies (Pillow is required to detect filter placeholders)
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      # -----------------------------------------------------------------------
      # 4. Download maps.db from the latest data release
      #    so we know which image URLs to fetch
      # -----------------------------------------------------------------------
      - name: Download maps.db from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.data_release_tag || 'data-latest' }}
        run: |
          mkdir -p data
          echo "Fetching data zip from release '$TAG'…"
          gh release download "$TAG" --pattern "data-*.zip" --dir /tmp/data-release
          ZIP=$(ls /tmp/data-release/data-*.zip | head -1)
          echo "Extracting maps.db from $ZIP"
          unzip -j "$ZIP" "maps.db" -d data/ || \
          unzip -j "$ZIP" "*/maps.db" -d data/ || \
          { echo "maps.db not found in release zip"; exit 1; }
          ls -lh data/maps.db

      # -----------------------------------------------------------------------
      # 5. Resolve the date tag used for the release asset name
      # -----------------------------------------------------------------------
      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Download images
      # -----------------------------------------------------------------------
      - name: Download POI images
        env:
          HMAPS_DATA: data
        run: |
          python tools/media.py \
            --workers "${{ github.event.inputs.workers || '2' }}" \
            --interval "${{ github.event.inputs.interval || '1.0' }}" \
            ${{ github.event.inputs.retry_failed == 'true' && '--retry-failed' || '' }}

      # -----------------------------------------------------------------------
      # 7. Summary
      # -----------------------------------------------------------------------
      - name: Show results
        run: |
          echo "=== data/media/ summary ==="
          COUNT=$(find data/media -maxdepth 1 -type f ! -name "*.txt" | wc -l)
          SIZE=$(du -sh data/media/ 2>/dev/null | cut -f1)
          echo "  Images downloaded: $COUNT"
          echo "  Total size:        $SIZE"
          echo ""
          echo "=== Pending (awaiting filter approval) ==="
          cat data/media/pending.txt 2>/dev/null || echo "  (none)"
          echo ""
          echo "=== Failed (permanent errors) ==="
          wc -l < data/media/failed.txt 2>/dev/null && head -20 data/media/failed.txt || echo "  (none)"

      # -----------------------------------------------------------------------
      # 8. Pack data/media/ into a zip
      # -----------------------------------------------------------------------
      - name: Package images
        run: |
          cd data
          zip -r "../media-${{ steps.date.outputs.value }}.zip" media/ \
            --exclude "media/*.part"
          cd ..
          ls -lh "media-${{ steps.date.outputs.value }}.zip"

      # -----------------------------------------------------------------------
      # 9. Upload as workflow artifact (7-day retention)
      # -----------------------------------------------------------------------
      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ steps.date.outputs.value }}
          path: media-${{ steps.date.outputs.value }}.zip
          retention-days: 7

      # -----------------------------------------------------------------------
      # 10. Attach to rolling "media-latest" GitHub Release
      # -----------------------------------------------------------------------
      - name: Upload to rolling "media-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-latest
          name: "תמונות POI — ${{ steps.date.outputs.value }}"
          body: |
            תמונות אופליין של נקודות עניין — עודכן ${{ steps.date.outputs.value }}

            **מכיל:** תמונות ממוזערות מ-Wikimedia Commons לכל ה-POIs במפה

            Built from commit ${{ github.sha }}
          files: media-${{ steps.date.outputs.value }}.zip
          prerelease: true
