name: Linux Desktop

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (for example 1.2.0)"
        required: false
        default: ""
      release:
        description: "Upload this Linux package to an existing version release?"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build-linux:
    name: Build Linux portable desktop package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(printf '%s' "$INPUT_VERSION" | sed 's/^v//' | xargs)"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
              version="${BASH_REMATCH[1]}"
            else
              version="$(python3 tools/set_version.py)"
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building Linux version: $version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set version everywhere
        run: |
          python tools/set_version.py "${{ steps.version.outputs.value }}"
          python tools/set_version.py --check

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            dbus-x11 xvfb openbox scrot wmctrl

      - name: Install Python build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install "pyinstaller==6.10.0" -r requirements-icons.txt

      - name: Generate icons
        run: |
          .venv/bin/python tools/make_icons.py --check || \
            echo "::warning::Committed icons are out of date - run python tools/make_icons.py"
          .venv/bin/python tools/make_icons.py

      - name: Build PyInstaller server bundle
        run: |
          .venv/bin/pyinstaller installer/hebrew-maps.spec \
            --distpath installer/dist \
            --workpath installer/build \
            --noconfirm

      - name: Smoke test server bundle
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log_file="$(mktemp)"
          HMAPS_DATA="$data_dir" HMAPS_NO_BROWSER=1 \
            installer/dist/hebrew-maps/hebrew-maps \
            --no-browser --host 127.0.0.1 --port 48197 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$data_dir"
            rm -f "$log_file"
          }
          trap cleanup EXIT
          for _ in $(seq 1 90); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              echo "Server exited before /api/health became ready" >&2
              exit 1
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:48197/api/health 2>/dev/null || true)"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Smoke test passed: /api/health -> $code"
              exit 0
            fi
            sleep 1
          done
          cat "$log_file"
          echo "Server did not answer /api/health within 90 seconds" >&2
          exit 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri desktop app
        run: |
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Fetch web assets
        run: .venv/bin/python tools/fetch_assets.py

      - name: Build low-zoom world map
        run: |
          if [ ! -f web/world/world.json ]; then
            .venv/bin/python -m tools.world
          fi

      - name: Assemble portable package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          pkg="HebrewMaps-Linux-${VERSION}"
          mkdir -p "dist/$pkg"
          cp -a installer/dist/hebrew-maps/. "dist/$pkg/"
          cp src-tauri/target/release/hebrew-maps-desktop "dist/$pkg/hebrew-maps-desktop"
          cp -a web "dist/$pkg/web"
          mkdir -p "dist/$pkg/data"
          if [ -d data/sample ]; then
            cp -a data/sample "dist/$pkg/data/"
          fi
          chmod +x "dist/$pkg/hebrew-maps" "dist/$pkg/hebrew-maps-desktop"
          cat > "dist/$pkg/run-hebrew-maps.sh" <<'EOF'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$(readlink -f "$0")")"
          exec ./hebrew-maps-desktop
          EOF
          chmod +x "dist/$pkg/run-hebrew-maps.sh"
          tar -C dist -czf "dist/${pkg}.tar.gz" "$pkg"
          sha256sum "dist/${pkg}.tar.gz" > "dist/${pkg}.tar.gz.sha256"

      - name: Smoke test desktop GUI
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          pkg_dir="$PWD/dist/HebrewMaps-Linux-${VERSION}"
          mkdir -p gui-smoke
          data_dir="$(mktemp -d)"
          export HMAPS_DATA="$data_dir"
          export HMAPS_DESKTOP_PORT=48197
          export XDG_CONFIG_HOME="$PWD/gui-smoke/xdg-config"
          export XDG_DATA_HOME="$PWD/gui-smoke/xdg-data"
          export GDK_BACKEND=x11
          trap 'rm -rf "$data_dir"' EXIT

          xvfb-run -a dbus-run-session -- bash -s -- "$pkg_dir" "$PWD/gui-smoke/desktop.png" <<'SCRIPT'
          set -euo pipefail
          pkg_dir="$1"
          screenshot="$2"
          openbox >/dev/null 2>&1 &
          wm_pid=$!
          cd "$pkg_dir"
          ./hebrew-maps-desktop > "$screenshot.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" "$wm_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            wait "$wm_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$screenshot.log"
              echo "Desktop app exited before becoming ready" >&2
              exit 1
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:48197/api/health 2>/dev/null || true)"
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$screenshot.log"
            echo "Desktop app did not start its map server within 60 seconds" >&2
            exit 1
          fi

          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$screenshot.log"
            echo "Desktop app exited after starting its map server" >&2
            exit 1
          fi
          window_found=0
          for _ in $(seq 1 15); do
            if wmctrl -lp | awk -v pid="$app_pid" '$3 == pid { found=1 } END { exit !found }'; then
              window_found=1
              break
            fi
            sleep 1
          done
          if [ "$window_found" -ne 1 ]; then
            wmctrl -lp
            cat "$screenshot.log"
            echo "Tauri did not create a visible desktop window" >&2
            exit 1
          fi
          scrot "$screenshot"
          test -s "$screenshot"
          echo "Desktop GUI smoke test passed; window found and screenshot saved to $screenshot"
          SCRIPT

      - name: Upload GUI smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Linux-GUI-Smoke-${{ steps.version.outputs.value }}
          path: |
            gui-smoke/desktop.png
            gui-smoke/desktop.png.log
          if-no-files-found: warn

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: HebrewMaps-Linux-${{ steps.version.outputs.value }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Linux package to version release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
                --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            echo "Waiting for the Windows workflow to create release $TAG_NAME ($attempt/60)"
            sleep 30
          done
          echo "Release $TAG_NAME was not created; the Linux package was not published" >&2
          exit 1
