name: Build Data Package (Modular)

# Modular workflow with 6 independent jobs for parallel execution and
# individual job retry capability. Each data package can be built separately.
#
# Jobs:
#   build-maps     – OSM core (POIs, streets, addresses, routing graph)
#   build-rich     – Wikidata/Wikipedia/Wikivoyage/Commons enrichment (depends on maps)
#   build-media    – Offline image thumbnails (depends on rich)
#   build-transit  – GTFS public-transport timetables (independent)
#   build-terrain  – Terrain + contours MBTiles (independent)
#   build-basemap  – Basemap vector tiles MBTiles (independent)
#
# Triggers:
#   - Manual dispatch (on demand, with skip flags)
#   - Weekly on Sunday 02:00 UTC (OSM data updates weekly)
#   - On version tags — installer release and data release stay in sync

on:
  workflow_dispatch:
    inputs:
      skip_terrain:
        description: "Skip terrain/DEM build (~20 min, ~500 MB Copernicus download)"
        type: boolean
        default: false
      skip_basemap:
        description: "Skip basemap MBTiles build (~30 min, requires Java)"
        type: boolean
        default: false
      skip_media:
        description: "Skip image download (can be slow — hundreds of MB from Wikimedia)"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * 0"   # every Sunday 02:00 UTC
  push:
    tags: ["v*.*.*"]

jobs:
  # =========================================================================
  # Job 1: Build Maps (OSM Core)
  # =========================================================================
  build-maps:
    name: Build Maps (OSM Core)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    outputs:
      date-tag: ${{ steps.date.outputs.value }}
      release-tag: ${{ steps.release.outputs.tag }}
      release-name: ${{ steps.release.outputs.name }}
      release-prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            osmium-tool \
            gdal-bin \
            libgdal-dev \
            zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"       >> "$GITHUB_OUTPUT"
            echo "name=מפות בעברית ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=data-latest"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"        >> "$GITHUB_OUTPUT"
            echo "name=נתונים עדכניים — ${{ steps.date.outputs.value }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download OSM extract
        run: python -m hmaps.etl download
        env:
          HMAPS_DATA: data

      - name: Build maps database (OSM core)
        run: python -m hmaps.etl build --engine pyosmium --no-enrich
        env:
          HMAPS_DATA: data

      - name: Package maps.zip
        run: |
          DB=$(cat data/maps.current 2>/dev/null || echo "maps.db")
          echo "Resolved live DB: data/$DB"
          cp "data/$DB" data/maps.db
          zip -j maps-${{ steps.date.outputs.value }}.zip data/maps.db

      - name: Upload maps.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          body: |
            נתוני ישראל — ${{ steps.date.outputs.value }}
            Built from ${{ github.sha }}
          files: maps-${{ steps.date.outputs.value }}.zip

      - name: Upload maps.db artifact for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: maps-db
          path: data/maps.db
          retention-days: 1

  # =========================================================================
  # Job 2: Build Rich (Wikidata/Wikipedia/Wikivoyage/Commons Enrichment)
  # =========================================================================
  build-rich:
    name: Build Rich (Enrichment)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-maps
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            osmium-tool \
            gdal-bin \
            libgdal-dev \
            zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Download maps.db artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-db
          path: data

      - name: Enrich DB (Wikidata + Wikipedia + Wikivoyage + Commons)
        run: python -m hmaps.etl enrich --db data/maps.db --steps wikidata,wikipedia,wikivoyage,commons,trails
        env:
          HMAPS_DATA: data

      - name: Package rich.zip
        run: |
          DB=$(cat data/maps.current 2>/dev/null || echo "maps.db")
          echo "Resolved enriched DB: data/$DB"
          cp "data/$DB" data/maps.db
          zip -j rich-${{ needs.build-maps.outputs.date-tag }}.zip data/maps.db

      - name: Upload rich.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-maps.outputs.release-tag }}
          files: rich-${{ needs.build-maps.outputs.date-tag }}.zip

      - name: Upload rich.db artifact for build-media
        uses: actions/upload-artifact@v4
        with:
          name: rich-db
          path: data/maps.db
          retention-days: 1

  # =========================================================================
  # Job 3: Build Media (Wikimedia Commons Images)
  # =========================================================================
  build-media:
    name: Build Media (Images)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build-rich
    if: ${{ github.event.inputs.skip_media != 'true' }}
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Download rich.db artifact
        uses: actions/download-artifact@v4
        with:
          name: rich-db
          path: data

      - name: Download POI images (Wikimedia Commons thumbnails)
        run: python tools/media.py --workers 3 --interval 0.8
        env:
          HMAPS_DATA: data

      - name: Package media.zip
        run: |
          cd data
          zip -r "../media-${{ needs.build-maps.outputs.date-tag }}.zip" media/ \
            --exclude "media/*.part" --exclude "media/*.tmp"
          cd ..

      - name: Upload media.zip → release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-maps.outputs.release-tag }}
          files: media-${{ needs.build-maps.outputs.date-tag }}.zip


  # =========================================================================
  # Job 4: Build Transit (GTFS Public Transport)
  # =========================================================================
  build-transit:
    name: Build Transit (GTFS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=data-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GTFS transit data
        run: python -m hmaps.etl gtfs
        env:
          HMAPS_DATA: data

      - name: Package transit.zip
        id: package
        run: |
          if [ -d data/transit ] && [ "$(ls -A data/transit)" ]; then
            zip -r transit-${{ steps.date.outputs.value }}.zip data/transit/
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No transit data built — skipping upload"
          fi

      - name: Upload transit.zip → release
        if: steps.package.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: transit-${{ steps.date.outputs.value }}.zip

  # =========================================================================
  # Job 5: Build Terrain (Copernicus DEM)
  # =========================================================================
  build-terrain:
    name: Build Terrain (DEM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.skip_terrain != 'true' }}
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Install terrain dependencies
        run: pip install -r requirements-terrain.txt
        continue-on-error: true

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=data-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build terrain layers
        run: python -m tools.terrain build --if-missing --clean
        env:
          HMAPS_DATA: data

      - name: Package terrain.zip
        id: package
        run: |
          FILES=""
          [ -f data/terrain.mbtiles ]  && FILES="$FILES data/terrain.mbtiles"
          [ -f data/contours.mbtiles ] && FILES="$FILES data/contours.mbtiles"
          if [ -n "$FILES" ]; then
            zip -j terrain-${{ steps.date.outputs.value }}.zip $FILES
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No terrain files found — skipping upload"
          fi

      - name: Upload terrain.zip → release
        if: steps.package.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: terrain-${{ steps.date.outputs.value }}.zip

  # =========================================================================
  # Job 6: Build Basemap (Vector Tiles MBTiles)
  # =========================================================================
  build-basemap:
    name: Build Basemap (Vector Tiles)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.skip_basemap != 'true' }}
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-native.txt

      - name: Set date tag
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=data-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Download web assets
        run: python tools/fetch_assets.py
        continue-on-error: true

      - name: Build basemap
        run: python tools/basemap.py
        env:
          HMAPS_DATA: data

      - name: Package basemap.zip
        id: package
        run: |
          if [ -f data/basemap.mbtiles ]; then
            zip -j basemap-${{ steps.date.outputs.value }}.zip data/basemap.mbtiles
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No basemap.mbtiles found — skipping upload"
          fi

      - name: Upload basemap.zip → release
        if: steps.package.outputs.built == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: basemap-${{ steps.date.outputs.value }}.zip

  # =========================================================================
  # Summary Job
  # =========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-maps, build-rich, build-media, build-transit, build-terrain, build-basemap]
    if: always()

    steps:
      - name: Show build summary
        run: |
          echo "=== Modular Build Complete ==="
          echo "Date tag: ${{ needs.build-maps.outputs.date-tag }}"
          echo "Release tag: ${{ needs.build-maps.outputs.release-tag }}"
          echo ""
          echo "Job Status:"
          echo "  build-maps: ${{ needs.build-maps.result }}"
          echo "  build-rich: ${{ needs.build-rich.result }}"
          echo "  build-media: ${{ needs.build-media.result }}"
          echo "  build-transit: ${{ needs.build-transit.result }}"
          echo "  build-terrain: ${{ needs.build-terrain.result }}"
          echo "  build-basemap: ${{ needs.build-basemap.result }}"
