name: Windows Installer

# Triggers:
#   - Every push/PR to main — builds and uploads the installer as an artifact
#   - Every version tag (v*.*.*) — also creates a GitHub Release with the installer EXE
#   - Manual dispatch — lets you pick version and whether to release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.0) — defaults to tag or 1.0.0"
        required: false
        default: ""
      release:
        description: "Create GitHub Release?"
        type: boolean
        required: false
        default: false

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------------------------------
      # 2. Resolve version string
      #    Priority: manual input → git tag → fallback to 1.0.0
      # -----------------------------------------------------------------------
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) {
            # Extract from tag like "refs/tags/v1.2.3"
            $ref = "${{ github.ref }}"
            if ($ref -match '^refs/tags/v(.+)$') {
              $v = $Matches[1]
            } else {
              $v = "1.0.0"
            }
          }
          Write-Host "Building version: $v"
          echo "value=$v" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 3. Python — use the same version as in the existing CI workflow
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 4. Install runtime dependencies + PyInstaller into a plain venv.
      #    We do NOT use the project's uv-managed .venv here because the
      #    GitHub runner has uv trampoline issues; a plain venv is reliable.
      # -----------------------------------------------------------------------
      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip.exe install --upgrade pip
          .venv\Scripts\pip.exe install -r requirements.txt
          .venv\Scripts\pip.exe install "pyinstaller==6.10.0" -r requirements-icons.txt

      # -----------------------------------------------------------------------
      # 5. Ensure Inno Setup 6 is available
      #    windows-latest already ships with Inno Setup 6.x — skip install if
      #    ISCC.exe is already present, otherwise install latest via Chocolatey.
      # -----------------------------------------------------------------------
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup already present: $(&$iscc /? 2>&1 | Select-Object -First 1)"
          } else {
            choco install innosetup -y --no-progress
          }

      # -----------------------------------------------------------------------
      # 6. Render all icons locally from web/icons/icon.svg (resvg, no download):
      #    installer/icon.ico, web/icons/*.png, src-tauri/icons/*.
      #    --check first only reports committed PNGs that are out of date.
      # -----------------------------------------------------------------------
      - name: Generate icons
        shell: pwsh
        run: |
          .venv\Scripts\python.exe tools\make_icons.py --check
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Committed icons are out of date - run python tools/make_icons.py" }
          .venv\Scripts\python.exe tools\make_icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -----------------------------------------------------------------------
      # 7. Run PyInstaller
      # -----------------------------------------------------------------------
      - name: PyInstaller — bundle app
        shell: pwsh
        run: |
          .venv\Scripts\pyinstaller.exe installer\hebrew-maps.spec `
            --distpath installer\dist `
            --workpath installer\build `
            --noconfirm

      # -----------------------------------------------------------------------
      # 7a. Smoke test: the bundled server must start and answer /api/health
      #     (catches missing hidden imports, e.g. numpy._core._exceptions).
      # -----------------------------------------------------------------------
      - name: Smoke test server bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\smoke-test.ps1

      # -----------------------------------------------------------------------
      # 7b. Tauri desktop app (src-tauri). Only the exe is built (bundle.active=false,
      #     no tauri CLI needed - tauri's custom-protocol feature is on in Cargo.toml);
      #     it is copied next to hebrew-maps.exe and Inno Setup packages it.
      # -----------------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri - build desktop exe
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path src-tauri\Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item src-tauri\target\release\hebrew-maps-desktop.exe installer\dist\hebrew-maps\ -Force
          Get-Item installer\dist\hebrew-maps\hebrew-maps-desktop.exe | Format-List Name, Length

      # -----------------------------------------------------------------------
      # 8. Fetch web assets (vendor JS, fonts-ui) — gitignored but needed by ISS
      # -----------------------------------------------------------------------
      - name: Fetch web assets
        shell: pwsh
        run: .venv\Scripts\python.exe tools\fetch_assets.py

      # -----------------------------------------------------------------------
      # 9. Compile Inno Setup installer
      # -----------------------------------------------------------------------
      - name: Inno Setup — compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Run ISCC from the installer\ dir so relative paths in the .iss are correct
          Push-Location installer
          & $iscc /DMyAppVersion=${{ steps.version.outputs.value }} hebrew-maps.iss
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 0) { exit $exit }

      # -----------------------------------------------------------------------
      # 9. Upload installer as a workflow artifact (available on every run)
      # -----------------------------------------------------------------------
      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: HebrewMaps-Setup-${{ steps.version.outputs.value }}
          path: installer/HebrewMaps-Setup-${{ steps.version.outputs.value }}.exe
          retention-days: 30

      # -----------------------------------------------------------------------
      # 10. Create GitHub Release (only on version tags or when manually requested)
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: "מפות בעברית v${{ steps.version.outputs.value }}"
          body: |
            ## התקנה / Installation

            הורידו את `HebrewMaps-Setup-${{ steps.version.outputs.value }}.exe` והריצו.

            Download `HebrewMaps-Setup-${{ steps.version.outputs.value }}.exe` and run it.

            **דרישות מערכת / System requirements:** Windows 10/11 x64

            ---
            Built automatically from commit ${{ github.sha }}
          files: installer/HebrewMaps-Setup-${{ steps.version.outputs.value }}.exe
          draft: false
          prerelease: false
