      animation: boot-slide 1.35s cubic-bezier(.65,0,.35,1) infinite; }
    .boot.done { opacity: 0; visibility: hidden; }
    .boot.done .boot-card { transform: scale(.96); }
    @keyframes boot-slide { from { right: -38%; } to { right: 100%; } }
    @keyframes boot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes boot-ring { 0% { opacity: .55; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(1.45); } }

      .boot-topo, .boot-logo .boot-pin, .boot-logo::before { animation: none; }

    }

      <button type="button" id="btn-layers" class="ctrl-btn" aria-label="שכבות" title="שכבות" aria-haspopup="dialog" aria-controls="layers-pop" aria-expanded="false"><span data-icon="layers"></span></button>
      <button type="button" id="btn-uitheme" class="ctrl-btn" aria-label="מצב לילה" title="מצב לילה"><span data-icon="moon"></span></button>
      <button type="button" id="btn-3d" class="ctrl-btn ctrl-3d" aria-pressed="false" aria-label="תצוגה בתלת-ממד" title="תלת-ממד (T)"><span aria-hidden="true">3D</span></button>
      <button type="button" id="btn-game" class="ctrl-btn ctrl-game" aria-label="מצב משחק – נהיגה במפה בתלת-ממד" title="מצב משחק (G)"><span data-icon="wheel"></span></button>
      <button type="button" id="btn-north" class="ctrl-btn" aria-label="איפוס כיוון המפה לצפון" hidden><span class="compass" aria-hidden="true"></span></button>
      <button type="button" id="btn-locate" class="ctrl-btn" aria-label="הצגת המיקום שלי" aria-pressed="false"><span data-icon="locate"></span></button>
      <div class="zoom-group">
        <button type="button" id="btn-zoom-in" class="ctrl-btn" aria-label="הגדלת המפה"><span data-icon="plus"></span></button>
        <button type="button" id="btn-zoom-out" class="ctrl-btn" aria-label="הקטנת המפה"><span data-icon="minus"></span></button>
      </div>
      <!-- its own column, next to the zoom buttons (like Google Maps) – web/css/app.css .ctrl-maptype -->
      <button type="button" id="btn-maptype" class="ctrl-btn ctrl-maptype" aria-label="סוג מפה" title="סוג מפה" aria-haspopup="dialog" aria-controls="maptype-pop" aria-expanded="false"><span class="swatch maptype-thumb swatch-light" aria-hidden="true"></span><span class="maptype-cap" aria-hidden="true">סוג מפה</span></button>
    </div>

    <div id="maptype-pop" class="popover" role="dialog" aria-labelledby="maptype-title" hidden>
      <h2 id="maptype-title" class="popover-title">סוג מפה</h2>
      <div class="map-types" role="radiogroup" aria-labelledby="maptype-title">
        <label class="map-type"><input type="radio" name="maptype" value="light"><span class="swatch swatch-light" aria-hidden="true"></span><span>רגילה</span></label>
        <label class="map-type"><input type="radio" name="maptype" value="nature"><span class="swatch swatch-nature" aria-hidden="true"></span><span>טבע וטיולים</span></label>
        <label class="map-type"><input type="radio" name="maptype" value="topo"><span class="swatch swatch-topo" aria-hidden="true"></span><span>טופוגרפית</span></label>
        <label class="map-type"><input type="radio" name="maptype" value="dark"><span class="swatch swatch-dark" aria-hidden="true"></span><span>לילה</span></label>
        <label class="map-type"><input type="radio" name="maptype" value="satellite"><span class="swatch swatch-satellite" aria-hidden="true"></span><span>תצלומי לוויין</span></label>
      </div>
      <p class="sat-offline-hint" id="sat-offline" hidden>
        <button type="button" class="btn btn-secondary btn-sm popover-btn" id="btn-sat-offline"><span data-icon="download"></span>הורדת תצלומי אוויר לשימוש בלי אינטרנט…</button>
      </p>
    </div>

    <div id="layers-pop" class="popover" role="dialog" aria-labelledby="layers-title" hidden>
      <h2 id="layers-title" class="popover-title">שכבות</h2>
      <div id="layer-checks" class="layer-checks" role="group" aria-labelledby="layers-title"></div>
    </div>

    <div id="ctx-menu" class="ctx-menu" role="menu" aria-label="פעולות בנקודה במפה" hidden>
      <button type="button" role="menuitem" data-act="here"><span data-icon="pin"></span>מה יש כאן?</button>
      <button type="button" role="menuitem" data-act="from"><span data-icon="m_depart"></span>מסלול מכאן</button>
      <button type="button" role="menuitem" data-act="to"><span data-icon="m_arrive"></span>מסלול לכאן</button>
      <button type="button" role="menuitem" data-act="nearby"><span data-icon="search"></span>מה יש בסביבה</button>
      <button type="button" role="menuitem" data-act="game"><span data-icon="wheel"></span>נהיגה מכאן (מצב משחק)</button>
      <button type="button" role="menuitem" data-act="measure"><span data-icon="ruler"></span>מדידת מרחק</button>
      <button type="button" role="menuitem" data-act="fav"><span data-icon="star"></span>שמירה במועדפים</button>
      <button type="button" role="menuitem" data-act="copy"><span data-icon="copy"></span>העתקת קואורדינטות</button>
      <button type="button" role="menuitem" data-act="print"><span data-icon="print"></span>הדפסת המפה</button>
      <button type="button" role="menuitem" data-act="print-route" hidden><span data-icon="print"></span>הדפסת המסלול והוראות</button>
    </div>
  </main>
