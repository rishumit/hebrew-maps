<!doctype html>
<html lang="he" dir="rtl" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מפות ישראל</title>
  <meta name="description" content="מפות ישראל – חלון האפליקציה: כמה מפות במקביל בלשוניות.">
  <meta name="theme-color" content="#DFE3E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D1F23" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/desktop.css">
  <!-- Desktop shell: a custom RTL title bar with tabs; each tab is a same-origin <iframe src="/map.html#…">.
       In the Tauri app the window has no native frame (decorations: false) and the window buttons call the
       window commands granted to this origin in src-tauri. In a normal browser the buttons stay hidden. -->
</head>
<body>
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="tb-brand" data-tauri-drag-region>
      <img class="tb-logo" src="/icons/icon.svg" alt="" width="18" height="18" draggable="false" data-tauri-drag-region>
      <span class="tb-title" data-tauri-drag-region>מפות ישראל</span>
    </div>
    <div class="tb-tabs" id="tabs-wrap" data-tauri-drag-region>
      <div class="tabstrip" id="tabstrip" role="tablist" aria-label="מפות פתוחות" data-tauri-drag-region></div>
      <button type="button" class="tb-new" id="btn-new-tab" aria-label="לשונית חדשה" title="לשונית חדשה (Ctrl+T)">
        <svg aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="tb-drag" data-tauri-drag-region></div>
    </div>
    <div class="winctl" id="winctl" role="group" aria-label="פקדי החלון" hidden>
      <button type="button" class="wc-btn" id="wc-min" aria-label="מזעור" title="מזעור">
        <svg aria-hidden="true" focusable="false" width="10" height="10" viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button type="button" class="wc-btn" id="wc-max" aria-label="הגדלה" title="הגדלה">
        <svg class="i-max" aria-hidden="true" focusable="false" width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg class="i-restore" aria-hidden="true" focusable="false" width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1" fill="none" stroke="currentColor" stroke-width="1"/><rect x=".5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button type="button" class="wc-btn wc-close" id="wc-close" aria-label="סגירה" title="סגירה">
        <svg aria-hidden="true" focusable="false" width="10" height="10" viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </header>
  <main class="views" id="views"></main>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="noscript">כדי להשתמש במפה יש להפעיל JavaScript.</p></noscript>
  <script type="module" src="/js/desktop.js"></script>
</body>
</html>
